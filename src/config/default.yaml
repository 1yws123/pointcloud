# ===================================================================
# encoder_4594 / Aero 分支 —— 默认超参配置
# 使用：python -m src.train --config src/config/default.yaml [其他 CLI 覆盖]
#      不传 --config 时等价于用本文件的所有值（与 argparse 默认值保持一致）。
# CLI 参数优先级最高，其次 YAML，最后 argparse 内置默认值。
# ===================================================================

# --------- 路径 ---------
pc_root:    /home/yuwenshi/B737/B737_4594/pc1
aero_root:  /home/yuwenshi/B737/G58_4594_aero
sdf_dir:    /home/yuwenshi/B737/B737_4594/sdf
save_dir:   /home/yuwenshi/B737/model_Aero/encoder_4594/checkpoints_6
ckpt_path:  /home/yuwenshi/B737/model_Aero/encoder_4594/checkpoints_6/best_cl_model.pth

# --------- 训练控制 ---------
epochs:           1500
batch_size:       20
lr:               0.0002      # 2e-4
weight_decay:     0.01        # 1e-2
val_split:        0.2
eval_interval:    10
plot_interval:    50
checkpoint_interval: 200
seed:             42
num_workers:      0
train_gpu:        "4"
eval_gpu:         "5"

# --------- 正则与早停（核心抗过拟合） ---------
kl_beta:             0.0001   # β·KL 正则，让 logvar 真正起作用
jitter_std:          0.001    # 训练时点云 jitter（原先 1e-4 形同虚设）
early_stop_patience: 30       # val_mae 连续 N 次 eval 无改善就停；0=关闭

# --------- 数据增强（物理无损） ---------
mirror_prob:   0.5   # XZ 对称飞机 + β=0 直飞，CL/CD 不变
point_dropout: 0.0   # 点 dropout 概率（>0 时启用）

# --------- 模型结构 ---------
model:
  latent_dim:          128
  plane_resolution:    128
  plane_features:      32
  num_fourier_freqs:   8
  # 对齐 Hunyuan3D 体量（2048 + 2048 + 4096 = 8192），细节分支占 50%
  num_points_uniform:     2048
  num_points_curvature:   2048
  num_points_importance:  4096
  dropout:                0.1  # encoder 内部 dropout 强度
